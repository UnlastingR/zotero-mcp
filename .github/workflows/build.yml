name: Cloud Build XPI

on:
  push:
    branches:
      - dev
      - main
      - master
  pull_request:
    branches:
      - dev
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: zotero-mcp-plugin/package-lock.json

      - name: Install dependencies
        working-directory: zotero-mcp-plugin
        run: npm ci

      - name: Build plugin XPI
        working-directory: zotero-mcp-plugin
        run: npm run build

      - name: Upload XPI Artifact
        uses: actions/upload-artifact@v4
        with:
          name: zotero-mcp-plugin-dev
          path: zotero-mcp-plugin/.scaffold/build/*.xpi
          if-no-files-found: error
